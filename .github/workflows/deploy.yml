name: Website Deploy

on:
  push:
    branches:
      - main
  # Les PR Dependabot doivent prouver qu'elles compilent avant d'être mergées.
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      # AVIF encoding costs a few minutes, so only redo it when a source image changes.
      - name: Restore optimized images
        uses: actions/cache@v6
        with:
          path: public/images
          key: images-${{ hashFiles('source-images/**', 'scripts/optimize-images.mjs') }}

      - name: Optimize images
        run: npm run images

      - name: Build static site
        run: npx nuxt build --preset github_pages

      # public/CNAME est copié verbatim dans .output/public par Nuxt. Sans lui, cette action
      # remplace tout le contenu de la branche website, le fichier CNAME disparaît et GitHub
      # Pages perd le domaine custom à chaque déploiement.
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.output/public
          publish_branch: website
